name: "Copilot Setup Steps"

# Run automatically when this file changes, and allow manual runs from the Actions tab.
on:
    workflow_dispatch:
    push:
        paths:
            - .github/workflows/copilot-setup-steps.yml
    pull_request:
        paths:
            - .github/workflows/copilot-setup-steps.yml

jobs:
    # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
    copilot-setup-steps:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            # The project targets Java 17 source/target compatibility and expects Java 21 at the
            # toolchain level (matching the .java-version file used by jenv on developer machines).
            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            # Cache the Gradle home and build caches so dependency resolution is fast.
            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v4
              with:
                  cache-read-only: false

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            # Pre-warm the Gradle build cache and download all dependencies.
            # --no-daemon avoids spawning a persistent daemon that lingers and consumes memory
            # after the step completes. The JVM heap is capped to stay within runner limits.
            - name: Pre-warm Gradle dependency cache
              run: |
                  ./gradlew dependencies \
                    --no-daemon \
                    -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError" \
                    --stacktrace
